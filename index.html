<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1f4e79">
  <title>Leader Directory</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Welcome / loading / sign-in screen -->
  <section id="welcome" class="welcome">
    <div class="welcome-card">
      <div class="logo" aria-hidden="true">LD</div>
      <h1>Leader Directory</h1>
      <p class="tagline">Roster, school calendars, events and onboarding for our leaders.</p>
      <div id="welcome-body"><div class="spinner" role="status" aria-label="Loading"></div></div>
    </div>
  </section>

  <div id="app" hidden>
    <header class="top">
      <a class="brand" href="#/roster">Leader Directory</a>
      <nav class="tabs" aria-label="Main">
        <a href="#/roster" data-tab="roster">Roster</a>
        <a href="#/calendar" data-tab="calendar">Calendar</a>
        <a href="#/schools" data-tab="schools">Schools</a>
        <a href="#/onboarding" data-tab="onboarding">Onboarding</a>
        <a href="#/more" data-tab="more">More</a>
      </nav>
    </header>
    <div id="banner"></div>
    <main id="view"></main>
  </div>

  <dialog id="dlg"></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>

  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
